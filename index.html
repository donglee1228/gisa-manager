<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>기사 관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1a1a2e;color:#eee;min-height:100vh;padding:16px;
  padding-bottom:84px;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
h2{text-align:center;font-size:18px;color:#aaa;margin-bottom:16px}
.work-date{text-align:center;font-size:22px;font-weight:800;margin:12px 0 20px;color:#e94560}
.section-label{font-size:13px;color:#888;margin-bottom:8px}
.worker-row{display:flex;gap:10px;margin-bottom:20px}
.worker-btn{
  flex:1;padding:16px;text-align:center;font-size:18px;font-weight:700;
  background:#16213e;border:2px solid #333;border-radius:14px;cursor:pointer;
  transition:all 0.15s;
}
.worker-btn.selected{border-color:#e94560;background:#2a1a3e;color:#e94560}
.worker-btn:active{transform:scale(0.97)}
.site-section{margin-bottom:18px}
.site-name{font-size:16px;font-weight:700;margin-bottom:8px;padding-left:4px}
.count-row{display:flex;gap:8px}
.count-btn{
  flex:1;padding:14px 0;text-align:center;font-size:20px;font-weight:700;
  background:#16213e;border:2px solid #333;border-radius:12px;cursor:pointer;
  transition:all 0.15s;
}
.count-btn.selected{border-color:#4CAF50;background:#1a3e2e;color:#4CAF50}
.count-btn:active{transform:scale(0.95)}
.save-btn{
  width:100%;padding:16px;margin:20px 0;font-size:18px;font-weight:700;
  background:#e94560;border:none;border-radius:14px;color:#fff;cursor:pointer;
}
.save-btn:active{opacity:0.8}
.save-btn:disabled{background:#555;color:#888}
.save-msg{text-align:center;font-size:14px;min-height:24px;margin-bottom:12px}
.divider{border-top:1px solid #333;margin:20px 0}
.record-card{background:#16213e;border-radius:12px;padding:14px;margin:8px 0}
.record-header{font-weight:700;font-size:15px;margin-bottom:6px}
.record-detail{font-size:14px;color:#aaa}
.record-detail span{margin-right:12px}
.history-toggle{text-align:center;color:#888;font-size:14px;cursor:pointer;padding:12px;margin-top:8px}
.history-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.history-table th,.history-table td{padding:8px 6px;text-align:center;border-bottom:1px solid #333}
.history-table th{color:#888;font-size:12px}
.print-btn{
  width:100%;padding:14px;margin:16px 0;font-size:16px;font-weight:600;
  background:#0f3460;border:1px solid #2196F3;border-radius:12px;color:#2196F3;cursor:pointer;
}
.print-btn:active{opacity:0.8}
.expired{text-align:center;padding:40px 20px}
.expired h1{color:#e94560;margin-bottom:16px}
.print-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.85);z-index:200;padding:16px;overflow-y:auto;
}
.print-overlay.show{display:block}
.print-box{
  background:#1a1a2e;border:1px solid #333;border-radius:12px;
  padding:12px;white-space:pre-wrap;font-family:monospace;font-size:11px;
  line-height:1.45;color:#eee;margin-bottom:12px;
}
.print-actions{display:flex;gap:8px;margin-bottom:12px}
.print-actions button{flex:1;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;color:#fff}
.copy-btn{background:#4CAF50}
.close-print-btn{background:#555}
.copy-msg{text-align:center;font-size:14px;color:#4CAF50;min-height:20px;margin-bottom:8px}

/* 수정하기 */
.edit-box{background:#16213e;border-radius:12px;padding:16px;margin:8px 0}
.edit-date{
  width:100%;padding:12px;background:#1a1a2e;border:1px solid #444;
  border-radius:8px;color:#eee;font-size:16px;color-scheme:dark;
}
.edit-existing-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;margin:4px 0;background:#1a1a2e;border-radius:8px;font-size:14px;
}
.edit-delete-btn{
  width:100%;padding:12px;margin-top:8px;font-size:15px;font-weight:600;
  background:none;border:1px solid #e94560;border-radius:12px;
  color:#e94560;cursor:pointer;
}
.edit-delete-btn:active{opacity:0.8}

/* 설정 */
.settings-btn{
  position:fixed;top:12px;right:12px;background:none;border:none;
  color:#555;font-size:22px;cursor:pointer;z-index:50;padding:8px;
}
.settings-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.9);z-index:300;padding:16px;overflow-y:auto;
}
.settings-overlay.show{display:block}
.set-section{background:#16213e;border-radius:12px;padding:16px;margin:12px 0}
.set-section h3{font-size:16px;margin-bottom:12px;color:#aaa}
.set-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #333}
.set-item:last-child{border:none}
.set-item input{
  flex:1;background:#1a1a2e;border:1px solid #444;border-radius:8px;
  padding:8px;color:#eee;font-size:15px;
}
.set-item button{
  background:#e94560;border:none;color:#fff;padding:6px 12px;
  border-radius:6px;font-size:13px;cursor:pointer;
}
.set-add{
  width:100%;padding:10px;margin-top:8px;background:none;
  border:1px dashed #555;border-radius:8px;color:#888;font-size:14px;cursor:pointer;
}
.set-close{
  width:100%;padding:14px;margin-top:16px;background:#333;border:none;
  border-radius:12px;color:#eee;font-size:16px;font-weight:600;cursor:pointer;
}

/* 탭 */
.tab-page{display:none}
.tab-page.active{display:block}
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;background:#16213e;border-top:1px solid #333;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tab-item{
  flex:1;text-align:center;padding:14px 0 16px;font-size:15px;font-weight:700;
  color:#888;cursor:pointer;transition:color 0.15s;
}
.tab-item.active{color:#e94560}
.tab-item .tab-ico{display:block;font-size:20px;margin-bottom:2px}
/* 월별 */
.month-block{background:#16213e;border-radius:12px;padding:14px;margin:12px 0}
.month-title{font-size:17px;font-weight:800;color:#e94560}
.month-empty{text-align:center;color:#888;padding:40px 16px}
.month-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent}
.month-head:active{opacity:0.7}
.month-head-right{display:flex;align-items:center;gap:10px}
.month-mini{font-size:13px;color:#e94560;font-weight:700}
.month-chev{font-size:13px;color:#888;width:16px;text-align:center}
.month-body{margin-top:12px}
/* 정비/경비 탭 */
.maint-memo{width:100%;min-height:90px;padding:12px;background:#1a1a2e;border:1px solid #444;border-radius:8px;color:#eee;font-size:15px;resize:vertical;font-family:inherit;line-height:1.5;color-scheme:dark}
.maint-amount{width:100%;padding:12px;background:#1a1a2e;border:1px solid #444;border-radius:8px;color:#eee;font-size:16px;color-scheme:dark}
.maint-card{background:#16213e;border-radius:12px;padding:14px;margin:8px 0}
.maint-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.maint-badge{font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px}
.maint-card-date{font-size:13px;color:#888}
.maint-card-memo{font-size:15px;color:#eee;white-space:pre-wrap;line-height:1.55;margin:6px 0}
.maint-card-amount{font-size:15px;font-weight:700;color:#4CAF50;text-align:right}
.maint-month-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 4px;padding:0 4px}
.maint-month-title{font-size:16px;font-weight:800;color:#aaa}
.maint-month-sum{font-size:14px;font-weight:700;color:#e94560}
</style>
</head>
<body>

      <div id="app">
        <button class="settings-btn" onclick="openSettings()">&#9881;</button>

      <!-- 기록 탭 -->
      <div class="tab-page active" id="tabRecord">
        <h2>기사 관리</h2>
        <div class="work-date" id="workDate"></div>
        <div class="section-label">누구의 기록?</div>
        <div class="worker-row" id="workerRow"></div>
        <div id="siteSections"></div>
        <button class="save-btn" id="saveBtn" disabled onclick="saveRecord()">기록 저장</button>
        <div class="save-msg" id="saveMsg"></div>
        <div class="divider"></div>
        <div class="section-label" id="todayLabel"></div>
        <div id="todayRecords"></div>
        <div class="history-toggle" onclick="toggleHistory()">이전 기록 보기 ▼</div>
        <div id="historyArea" style="display:none"></div>
        <div id="printButtons"></div>

        <div class="divider"></div>
        <div class="history-toggle" onclick="toggleEdit()">수정하기 ▼</div>
        <div id="editArea" style="display:none">
          <div class="edit-box">
            <div class="section-label">날짜 선택</div>
            <input type="date" id="editDate" class="edit-date" onchange="loadEditDate()">
            <div class="section-label" style="margin-top:12px">기사</div>
            <div class="worker-row" id="editWorkerRow"></div>
            <div id="editSiteSections"></div>
            <div id="editExisting"></div>
            <button class="save-btn" id="editSaveBtn" disabled onclick="saveEdit()">수정 저장</button>
            <button class="edit-delete-btn" id="editDeleteBtn" style="display:none" onclick="deleteEdit()">이 날 기록 삭제</button>
            <div class="save-msg" id="editMsg"></div>
          </div>
        </div>
      </div>
      <!-- /기록 탭 -->

      <!-- 월별 탭 -->
      <div class="tab-page" id="tabMonthly">
        <h2>월별 기록</h2>
        <div id="monthlyArea"></div>
      </div>
      <!-- /월별 탭 -->

      <!-- 정비/경비 탭 -->
      <div class="tab-page" id="tabMaint">
        <h2>경비 · 정비 기록</h2>
        <div class="section-label">날짜</div>
        <input type="date" id="maintDate" class="edit-date">
        <div class="section-label" style="margin-top:12px">구분</div>
        <div class="worker-row" id="maintTypeRow"></div>
        <div class="section-label">내용 (자세히 적기)</div>
        <textarea id="maintMemo" class="maint-memo" placeholder="예: 엔진오일 교체, 앞타이어 2개 교체 + 위치교환, 어디 정비소에서 했는지 등 자세히..."></textarea>
        <div class="section-label" style="margin-top:12px">금액 (원) · 없으면 비워두기</div>
        <input type="number" id="maintAmount" class="maint-amount" inputmode="numeric" placeholder="예: 80000">
        <button class="save-btn" id="maintSaveBtn" onclick="saveMaint()">기록 저장</button>
        <div class="save-msg" id="maintMsg"></div>
        <div class="divider"></div>
        <div id="maintList"></div>
      </div>
      <!-- /정비 탭 -->

      </div>

      <!-- 하단 탭바 -->
      <div class="tab-bar">
        <div class="tab-item active" id="tabBtnRecord" onclick="switchTab('record')">
          <span class="tab-ico">&#128221;</span>기록
        </div>
        <div class="tab-item" id="tabBtnMonthly" onclick="switchTab('monthly')">
          <span class="tab-ico">&#128197;</span>월별
        </div>
        <div class="tab-item" id="tabBtnMaint" onclick="switchTab('maint')">
          <span class="tab-ico">&#128295;</span>정비
        </div>
      </div>

<!-- 출력 모달 -->
<div class="print-overlay" id="printOverlay">
  <div class="print-actions">
    <button class="copy-btn" onclick="copyPrint()">복사하기</button>
    <button class="close-print-btn" onclick="closePrint()">닫기</button>
  </div>
  <div class="copy-msg" id="copyMsg"></div>
  <div class="print-box" id="printBox"></div>
</div>

<!-- 설정 모달 -->
<div class="settings-overlay" id="settingsOverlay">
  <h2 style="margin-bottom:16px">설정</h2>
  <div class="set-section">
    <h3>기사 이름</h3>
    <div id="setWorkers"></div>
    <button class="set-add" onclick="addWorker()">+ 기사 추가</button>
  </div>
  <div class="set-section">
    <h3>현장 이름</h3>
    <div id="setSites"></div>
    <button class="set-add" onclick="addSite()">+ 현장 추가</button>
  </div>
  <button class="set-close" onclick="closeSettings()">닫기</button>
</div>

<div id="expiredScreen" style="display:none">
  <div class="expired">
    <h1>만료됨</h1>
    <p>1달 이상 사용하지 않아 데이터가 삭제되었습니다.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove }
  from "https://www.gstatic.com/firebasejs/11.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAU95ureT0C0Cn2NszQk_BERnnwdnRs7XI",
  authDomain: "gisa-manager.firebaseapp.com",
  databaseURL: "https://gisa-manager-default-rtdb.firebaseio.com",
  projectId: "gisa-manager",
  storageBucket: "gisa-manager.firebasestorage.app",
  messagingSenderId: "658512800042",
  appId: "1:658512800042:web:969e7687bcf0e5ba375653"
});
const db = getDatabase(app);

const MAX_COUNT = 5;
const EXPIRY_DAYS = 30;
const COLORS = ["#4CAF50","#2196F3","#FF9800","#9C27B0","#E91E63","#00BCD4","#FF5722","#607D8B"];
const DEFAULT_WORKERS = ["이기사"];
const DEFAULT_SITES = [{name:"소노벨",color:"#4CAF50"},{name:"쿠팡",color:"#2196F3"},{name:"평택쿠팡",color:"#FF9800"},{name:"용인쿠팡(3.5톤)",color:"#9C27B0"},{name:"평택5센터",color:"#E91E63"}];

// ===== 평택5센터 전용 '탕' 단위 (반탕/한탕/두탕) =====
// 저장 데이터에는 0.5 같은 소수점(.)을 절대 쓰지 않고 "반탕"/"한탕"/"두탕" 문자열만 저장
// → Firebase 키/값의 점(.) 문제(과거 "용인쿠팡(3.5톤)" 류) 원천 차단. 0.5/1/2 환산은 계산용으로만 사용.
const TANG_OPTIONS = [{label:"반탕",value:"반탕"},{label:"한탕",value:"한탕"},{label:"두탕",value:"두탕"}];
const TANG_MAP = {"반탕":0.5,"한탕":1,"두탕":2}; // 회전수 환산표(계산 전용, DB 저장 안 함)
function isTangSite(name){ return name === "평택5센터"; }
// 기록 값 → 숫자 회전수 (기존 숫자 기록은 그대로, 탕 문자열은 환산)
function toNum(c){ return typeof c === "number" ? c : (TANG_MAP[c] || 0); }
// 기록 값 → 표시 문자열 ("쿠팡 x3" / "평택5센터 반탕")
function fmtCount(c){ return typeof c === "number" ? "x"+c : c; }

let WORKERS = [];
let SITES = [];
let selectedWorker = null;
let selectedCounts = {};
let allRecords = {};

// Firebase 키로 못 쓰는 문자(. # $ [ ] /)를 _ 로 치환 — 저장 키 안전화 (예: "용인쿠팡(3.5톤)")
function siteKey(name){ return name.replace(/[.#$\[\]\/]/g, "_"); }
// 저장 키 → 표시용 현장명 복원
function keyToName(k){ const s = SITES.find(x => siteKey(x.name) === k); return s ? s.name : k; }

// ===== 설정 로드 (Firebase에서) =====
function loadConfig() {
  onValue(ref(db, "config"), snap => {
    const val = snap.val();
    if (val) {
      WORKERS = val.workers || DEFAULT_WORKERS;
      SITES = (val.sites || DEFAULT_SITES).map((s,i) =>
        typeof s === "string" ? {name:s, color:COLORS[i%COLORS.length]} : s
      );
      // 평택5센터 자동 추가 (기존 현장/기록은 절대 건드리지 않고, 없을 때 1회만 뒤에 덧붙임)
      if (!SITES.some(s => s.name === "평택5센터")) {
        SITES.push({name:"평택5센터", color: COLORS[SITES.length % COLORS.length]});
        set(ref(db, "config/sites"), SITES);
      }
    } else {
      WORKERS = [...DEFAULT_WORKERS];
      SITES = [...DEFAULT_SITES];
      set(ref(db, "config"), {workers: WORKERS, sites: SITES});
    }
    renderAll();
  });
}

// ===== 출근일 계산 =====
function getWorkDate() {
  const now = new Date();
  if (now.getHours() < 12) now.setDate(now.getDate() - 1);
  return now;
}
function formatDate(d) {
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
// 당월(현재 출근일 기준) 키 "YYYY-MM"
function currentMonthKey() {
  const wd = getWorkDate();
  return `${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,"0")}`;
}
// 당월에 속한 날짜키만 정렬해서 반환
function currentMonthDates() {
  const cm = currentMonthKey();
  return Object.keys(allRecords).filter(dk => dk.startsWith(cm)).sort();
}

// ===== 만료 체크 =====
async function checkExpiry() {
  const snap = await get(ref(db, "lastActivity"));
  if (snap.exists()) {
    const diff = Date.now() - snap.val();
    if (diff > EXPIRY_DAYS * 24*60*60*1000) {
      await remove(ref(db));
      document.getElementById("app").style.display = "none";
      document.getElementById("expiredScreen").style.display = "block";
      return false;
    }
  }
  return true;
}

// ===== 렌더링 =====
function renderAll() {
  renderWorkDate();
  renderWorkers();
  renderSites();
  renderPrintButtons();
  updateSaveBtn();
  renderTodayRecords();
}

function renderWorkDate() {
  const wd = getWorkDate();
  document.getElementById("workDate").textContent =
    `${wd.getFullYear()}년 ${wd.getMonth()+1}월 · ` + formatDate(wd) + " 기록";
}

function renderWorkers() {
  const row = document.getElementById("workerRow");
  row.innerHTML = "";
  WORKERS.forEach((name, i) => {
    const btn = document.createElement("div");
    btn.className = "worker-btn" + (selectedWorker === i ? " selected" : "");
    btn.textContent = name;
    btn.onclick = () => { selectedWorker = i; renderWorkers(); updateSaveBtn(); };
    row.appendChild(btn);
  });
}

function renderSites() {
  const container = document.getElementById("siteSections");
  container.innerHTML = "";
  SITES.forEach((site, si) => {
    const section = document.createElement("div");
    section.className = "site-section";
    const label = document.createElement("div");
    label.className = "site-name";
    label.style.color = site.color;
    label.textContent = site.name;
    section.appendChild(label);
    const row = document.createElement("div");
    row.className = "count-row";
    const opts = isTangSite(site.name)
      ? TANG_OPTIONS
      : Array.from({length: MAX_COUNT+1}, (_,c) => ({label:String(c), value:c}));
    opts.forEach(opt => {
      const sel = selectedCounts[si] === opt.value;
      const btn = document.createElement("div");
      btn.className = "count-btn" + (sel ? " selected" : "");
      btn.textContent = opt.label;
      btn.style.borderColor = sel ? site.color : "#333";
      btn.style.background = sel ? site.color + "22" : "#16213e";
      btn.style.color = sel ? site.color : "#eee";
      btn.onclick = () => {
        // 탕 버튼은 0이 없으므로 다시 누르면 해제, 숫자 버튼은 기존처럼 선택
        if (isTangSite(site.name) && sel) delete selectedCounts[si];
        else selectedCounts[si] = opt.value;
        renderSites(); updateSaveBtn();
      };
      row.appendChild(btn);
    });
    section.appendChild(row);
    container.appendChild(section);
  });
}

function renderPrintButtons() {
  const container = document.getElementById("printButtons");
  let html = '<div style="display:flex;gap:8px;margin:16px 0">';
  WORKERS.forEach(w => {

}

function updateSaveBtn() {
  const btn = document.getElementById("saveBtn");
  const hasWorker = selectedWorker !== null;
  const hasCounts = Object.keys(selectedCounts).length > 0 && Object.values(selectedCounts).some(c => toNum(c) > 0);
  btn.disabled = !(hasWorker && hasCounts);
}

// ===== 저장 =====
window.saveRecord = async function() {
  if (selectedWorker === null) return;
  const wd = getWorkDate();
  const dk = dateKey(wd);
  const worker = WORKERS[selectedWorker];
  const data = {};
  SITES.forEach((site, si) => { if (toNum(selectedCounts[si]) > 0) data[siteKey(site.name)] = selectedCounts[si]; });
  if (Object.keys(data).length === 0) return;
  await set(ref(db, `records/${dk}/${worker}`), data);
  await set(ref(db, "lastActivity"), Date.now());
  const msg = document.getElementById("saveMsg");
  const parts = Object.entries(data).map(([k,v]) => `${keyToName(k)} ${fmtCount(v)}`).join(", ");
  msg.textContent = `${formatDate(wd)} ${worker}: ${parts} 저장!`;
  msg.style.color = "#4CAF50";
  setTimeout(() => { msg.textContent = ""; }, 3000);
  selectedCounts = {};
  renderSites();
  updateSaveBtn();
};

function renderTodayRecords() {
  const wd = getWorkDate();

window.toggleHistory = function() {
  const area = document.getElementById("historyArea");
  if (area.style.display === "none") { area.style.display = "block"; renderHistory(); }
  else { area.style.display = "none"; }
};

function renderHistory() {
  const area = document.getElementById("historyArea");
  // 당월(현재 달) 기록만 최신순으로
  const dates = currentMonthDates().reverse();
  if (dates.length === 0) { area.innerHTML = '<p style="text-align:center;color:#888;padding:16px">이번 달 기록 없음</p>'; return; }
  let html = '<table class="history-table"><thead><tr><th>날짜</th>';
  WORKERS.forEach(w => html += `<th>${w}</th>`);
  html += '</tr></thead><tbody>';
  for (const dk of dates) {
    const dayRec = allRecords[dk];
    const [y,m,d] = dk.split("-");
    const dt = new Date(+y, +m-1, +d);
    const days = ["일","월","화","수","목","금","토"];
    html += `<tr><td>${+m}/${+d}(${days[dt.getDay()]})</td>`;
    WORKERS.forEach(w => {
      const wr = dayRec[w] || {};
      const parts = Object.entries(wr).map(([s,c]) => `${keyToName(s)}${c}`).join(" ");
      if (parts) {
        html += `<td>${parts} <span style="color:#e94560;cursor:pointer;font-size:11px" onclick="deleteRecord('${dk}','${w}')">[x]</span></td>`;
      } else { html += `<td>-</td>`; }
    });
    html += '</tr>';
  }
  html += '</tbody></table>';
  // 월간 합계 (당월)
  const curMonth = currentMonthKey();
  const monthDates = dates;
  if (monthDates.length > 0) {
    const totals = {};
    WORKERS.forEach(w => { totals[w] = {}; });
    for (const dk of monthDates) {
      for (const [w, sites] of Object.entries(allRecords[dk] || {})) {
        if (!totals[w]) totals[w] = {};
        for (const [s, c] of Object.entries(sites)) { totals[w][s] = (totals[w][s] || 0) + toNum(c); }
      }
    }
    html += `<h3 style="margin-top:20px;font-size:15px;color:#aaa">${+curMonth.split("-")[1]}월 합계</h3>`;
    html += '<table class="history-table"><thead><tr><th></th>';
    SITES.forEach(s => html += `<th style="color:${s.color}">${s.name}</th>`);
    html += '<th>합계</th></tr></thead><tbody>';
    WORKERS.forEach(w => {
      let rt = 0;
      html += `<tr><td style="font-weight:700">${w}</td>`;
      SITES.forEach(s => { const v = totals[w]?.[siteKey(s.name)] || 0; rt += v; html += `<td>${v}</td>`; });
      html += `<td style="font-weight:700;color:#e94560">${rt}</td></tr>`;
    });
    html += '</tbody></table>';
  }
  area.innerHTML = html;
}

window.deleteRecord = async function(dk, worker) {
  const [y,m,d] = dk.split("-");
  const days = ["일","월","화","수","목","금","토"];
  const dt = new Date(+y, +m-1, +d);
  if (confirm(`${+m}/${+d}(${days[dt.getDay()]}) ${worker} 삭제?`)) {
    await remove(ref(db, `records/${dk}/${worker}`));
  }
};

// ===== 출력 =====
window.printWorker = function(worker) {
  // 당월(현재 달) 기록만 출력
  const dates = currentMonthDates();
  if (dates.length === 0) { alert("이번 달 기록이 없습니다"); return; }
  const dayNames = ["일","월","화","수","목","금","토"];
  const cm = currentMonthKey().split("-");
  let text = `[ ${worker} ] ${+cm[0]}년 ${+cm[1]}월\n\n`;
  let workerTotal = 0;
  const siteTotals = {};
  for (const dk of dates) {
    const wr = allRecords[dk]?.[worker];
    if (!wr) continue;
    const [y,m,d] = dk.split("-");
    const dt = new Date(+y, +m-1, +d);
    const parts = [];
    let dayTotal = 0;
    for (const [site, cnt] of Object.entries(wr)) {
      const nm = keyToName(site);
      parts.push(`${nm} ${cnt}`);
      dayTotal += toNum(cnt);
      siteTotals[nm] = (siteTotals[nm] || 0) + toNum(cnt);
    }
    workerTotal += dayTotal;
    text += `${+m}/${+d} ${dayNames[dt.getDay()]}  ${parts.join(" / ")}  +${dayTotal}\n`;
  }
  text += `\n----------\n`;
  for (const [site, cnt] of Object.entries(siteTotals)) text += `${site}: ${cnt}\n`;
  text += `합계: ${workerTotal}회전`;
  document.getElementById("printBox").textContent = text;
  document.getElementById("printOverlay").classList.add("show");
  document.getElementById("copyMsg").textContent = "";
};

window.copyPrint = async function() {
  const text = document.getElementById("printBox").textContent;
  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("copyMsg").textContent = "복사 완료!";
  } catch(e) {
    const box = document.getElementById("printBox");
    const range = document.createRange();
    range.selectNodeContents(box);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.getElementById("copyMsg").textContent = "선택됨 - 복사해주세요";
  }
};
window.closePrint = function() { document.getElementById("printOverlay").classList.remove("show"); };

// ===== 월별 탭: 전체 달을 월 단위로 그룹핑 (드롭다운 아코디언) =====
let openMonths = null; // 펼쳐진 달 "YYYY-MM" 집합 (렌더 사이 상태 유지)

window.toggleMonth = function(mk) {
  const body = document.getElementById("mbody_" + mk);
  const chev = document.getElementById("mchev_" + mk);
  if (!body) return;
  const willOpen = body.style.display === "none";
  body.style.display = willOpen ? "block" : "none";
  if (chev) chev.textContent = willOpen ? "▲" : "▼";
  if (willOpen) openMonths.add(mk); else openMonths.delete(mk);
};

function renderMonthly() {
  const area = document.getElementById("monthlyArea");
  const dates = Object.keys(allRecords).sort(); // "YYYY-MM-DD" 오름차순
  if (dates.length === 0) {
    area.innerHTML = '<div class="month-empty">아직 기록이 없습니다</div>';
    return;
  }
  // 월(YYYY-MM)별로 날짜키 그룹핑
  const groups = {};
  for (const dk of dates) {
    const mk = dk.slice(0, 7); // "YYYY-MM"
    (groups[mk] = groups[mk] || []).push(dk);
  }
  const days = ["일","월","화","수","목","금","토"];
  const months = Object.keys(groups).sort().reverse(); // 최신 달이 위로
  if (openMonths === null) openMonths = new Set([months[0]]); // 최초엔 최신 달만 펼침
  let html = "";
  for (const mk of months) {
    const [my, mm] = mk.split("-");
    const monthDates = groups[mk]; // 이미 오름차순
    const isOpen = openMonths.has(mk);

    // 이 달 합계 미리 계산 (헤더 회전수 표시용)
    const totals = {};
    WORKERS.forEach(w => { totals[w] = {}; });
    for (const dk of monthDates) {
      for (const [w, sites] of Object.entries(allRecords[dk] || {})) {
        if (!totals[w]) totals[w] = {};
        for (const [s, c] of Object.entries(sites)) { totals[w][s] = (totals[w][s] || 0) + toNum(c); }
      }
    }
    let monthGrand = 0;
    for (const w of Object.keys(totals)) for (const c of Object.values(totals[w])) monthGrand += toNum(c);

    html += `<div class="month-block">`;
    // 드롭다운 헤더
    html += `<div class="month-head" onclick="toggleMonth('${mk}')">`;
    html += `<span class="month-title">${+my}년 ${+mm}월</span>`;
    html += `<span class="month-head-right"><span class="month-mini">${monthGrand}회전</span><span class="month-chev" id="mchev_${mk}">${isOpen ? "▲" : "▼"}</span></span>`;
    html += `</div>`;
    // 드롭다운 본문
    html += `<div class="month-body" id="mbody_${mk}" style="display:${isOpen ? "block" : "none"}">`;

    // 날짜별 표
    html += '<table class="history-table"><thead><tr><th>날짜</th>';
    WORKERS.forEach(w => html += `<th>${w}</th>`);
    html += '</tr></thead><tbody>';
    for (const dk of monthDates) {
      const dayRec = allRecords[dk] || {};
      const [y,m,d] = dk.split("-");
      const dt = new Date(+y, +m-1, +d);
      html += `<tr><td>${+m}/${+d}(${days[dt.getDay()]})</td>`;
      WORKERS.forEach(w => {
        const wr = dayRec[w] || {};
        const parts = Object.entries(wr).map(([s,c]) => `${keyToName(s)}${c}`).join(" ");
        html += `<td>${parts || "-"}</td>`;
      });
      html += '</tr>';
    }
    html += '</tbody></table>';

    // 이 달 기사별/현장별 합계 표
    html += `<h3 style="margin-top:16px;font-size:14px;color:#aaa">${+mm}월 합계</h3>`;
    html += '<table class="history-table"><thead><tr><th></th>';
    SITES.forEach(s => html += `<th style="color:${s.color}">${s.name}</th>`);
    html += '<th>합계</th></tr></thead><tbody>';
    WORKERS.forEach(w => {
      let rt = 0;
      html += `<tr><td style="font-weight:700">${w}</td>`;
      SITES.forEach(s => { const v = totals[w]?.[siteKey(s.name)] || 0; rt += v; html += `<td>${v}</td>`; });
      html += `<td style="font-weight:700;color:#e94560">${rt}</td></tr>`;
    });
    html += '</tbody></table>';
    html += `<div style="text-align:right;margin-top:8px;font-weight:700;color:#e94560">총 ${monthGrand}회전</div>`;
    // 이 달 출력 버튼
    html += `<button class="print-btn" style="margin-top:12px" onclick="printMonth('${mk}')">${+mm}월 기록 출력</button>`;

    html += `</div>`; // /month-body
    html += `</div>`; // /month-block
  }
  area.innerHTML = html;
}

// ===== 월별 출력 (해당 달 전체 기사 기록을 텍스트로) =====
window.printMonth = function(mk) {
  const monthDates = Object.keys(allRecords).filter(dk => dk.slice(0,7) === mk).sort();
  if (monthDates.length === 0) { alert("기록이 없습니다"); return; }
  const dayNames = ["일","월","화","수","목","금","토"];
  const [my, mm] = mk.split("-");
  let text = `[ ${+my}년 ${+mm}월 ] 월별 기록\n`;
  const grandSite = {};
  let grandTotal = 0;
  WORKERS.forEach(worker => {
    const has = monthDates.some(dk => allRecords[dk]?.[worker]);
    if (!has) return;
    text += `\n■ ${worker}\n`;
    let wTotal = 0;
    const wSite = {};
    for (const dk of monthDates) {
      const wr = allRecords[dk]?.[worker];
      if (!wr) continue;
      const [y,m,d] = dk.split("-");
      const dt = new Date(+y, +m-1, +d);
      const parts = [];
      let dayTotal = 0;
      for (const [site, cnt] of Object.entries(wr)) {
        const nm = keyToName(site);
        parts.push(`${nm} ${cnt}`);
        dayTotal += toNum(cnt);
        wSite[nm] = (wSite[nm] || 0) + toNum(cnt);
        grandSite[nm] = (grandSite[nm] || 0) + toNum(cnt);
      }
      wTotal += dayTotal;
      text += `${+m}/${+d} ${dayNames[dt.getDay()]}  ${parts.join(" / ")}  +${dayTotal}\n`;
    }
    text += `  └ ${Object.entries(wSite).map(([s,c]) => `${s} ${c}`).join(", ")} = ${wTotal}회전\n`;
    grandTotal += wTotal;
  });
  text += `\n----------\n[ 전체 합계 ]\n`;
  for (const [s, c] of Object.entries(grandSite)) text += `${s}: ${c}\n`;
  text += `총 ${grandTotal}회전`;
  document.getElementById("printBox").textContent = text;
  document.getElementById("printOverlay").classList.add("show");
  document.getElementById("copyMsg").textContent = "";
};

let editCounts = {};

window.toggleEdit = function() {

function renderEditWorkers() {
  const row = document.getElementById("editWorkerRow");
  row.innerHTML = "";
  WORKERS.forEach((name, i) => {
    const btn = document.createElement("div");
    btn.className = "worker-btn" + (editWorker === i ? " selected" : "");

      editWorker = i;
      renderEditWorkers();
      loadEditDate();
      updateEditBtn();
    };
    row.appendChild(btn);

}

function renderEditSites() {
  const container = document.getElementById("editSiteSections");
  container.innerHTML = "";
  SITES.forEach((site, si) => {
    const section = document.createElement("div");
    section.className = "site-section";
    const label = document.createElement("div");
    label.className = "site-name";
    label.style.color = site.color;
    label.textContent = site.name;
    section.appendChild(label);
    const row = document.createElement("div");
    row.className = "count-row";
    const opts = isTangSite(site.name)
      ? TANG_OPTIONS
      : Array.from({length: MAX_COUNT+1}, (_,c) => ({label:String(c), value:c}));
    opts.forEach(opt => {
      const sel = editCounts[si] === opt.value;
      const btn = document.createElement("div");
      btn.className = "count-btn" + (sel ? " selected" : "");
      btn.textContent = opt.label;
      btn.style.borderColor = sel ? site.color : "#333";
      btn.style.background = sel ? site.color + "22" : "#16213e";
      btn.style.color = sel ? site.color : "#eee";
      btn.onclick = () => {
        if (isTangSite(site.name) && sel) delete editCounts[si];
        else editCounts[si] = opt.value;
        renderEditSites(); updateEditBtn();
      };
      row.appendChild(btn);
    });
    section.appendChild(row);
    container.appendChild(section);
  });
}

window.loadEditDate = function() {
  const dk = document.getElementById("editDate").value;
  if (!dk) return;
  const existing = document.getElementById("editExisting");
  const dayRec = allRecords[dk] || {};
  const delBtn = document.getElementById("editDeleteBtn");

  // 선택된 기사의 기존 기록 불러오기
  if (editWorker !== null) {
    const worker = WORKERS[editWorker];
    const wr = dayRec[worker] || {};
    // 기존 값으로 카운트 세팅
    editCounts = {};
    SITES.forEach((site, si) => {
      const k = siteKey(site.name);
      if (wr[k]) editCounts[si] = wr[k];
    });
    renderEditSites();
    delBtn.style.display = Object.keys(wr).length > 0 ? "block" : "none";
  }

  // 해당 날짜 전체 기록 표시
  let html = '<div class="section-label" style="margin-top:12px">이 날 기록</div>';
  if (Object.keys(dayRec).length === 0) {
    html += '<div class="edit-existing-item" style="color:#888">기록 없음</div>';
  } else {
    for (const [w, sites] of Object.entries(dayRec)) {
      const parts = Object.entries(sites).map(([s,c]) => `${keyToName(s)} ${fmtCount(c)}`).join(", ");
      const total = Object.values(sites).reduce((a,b) => a+toNum(b), 0);
      html += `<div class="edit-existing-item"><span>${w}</span><span>${parts} (${total})</span></div>`;
    }
  }
  existing.innerHTML = html;
  updateEditBtn();
};

function updateEditBtn() {
  const btn = document.getElementById("editSaveBtn");
  const dk = document.getElementById("editDate").value;
  btn.disabled = !(editWorker !== null && dk);
}

window.saveEdit = async function() {
  if (editWorker === null) return;
  const dk = document.getElementById("editDate").value;
  if (!dk) return;
  const worker = WORKERS[editWorker];

  const data = {};
  SITES.forEach((site, si) => {
    if (toNum(editCounts[si]) > 0) data[siteKey(site.name)] = editCounts[si];
  });

  if (Object.keys(data).length === 0) {
    // 전부 0이면 삭제
    await remove(ref(db, `records/${dk}/${worker}`));
  } else {
    await set(ref(db, `records/${dk}/${worker}`), data);
  }
  await set(ref(db, "lastActivity"), Date.now());

  const msg = document.getElementById("editMsg");
  const [y,m,d] = dk.split("-");
  const parts = Object.entries(data).map(([k,v]) => `${keyToName(k)} ${fmtCount(v)}`).join(", ");
  msg.textContent = `${+m}/${+d} ${worker}: ${parts || "삭제"} 완료!`;
  msg.style.color = "#4CAF50";
  setTimeout(() => { msg.textContent = ""; }, 3000);

  loadEditDate();
};

window.deleteEdit = async function() {
  if (editWorker === null) return;
  const dk = document.getElementById("editDate").value;
  const worker = WORKERS[editWorker];
  if (confirm(`${dk} ${worker} 기록 삭제?`)) {
    await remove(ref(db, `records/${dk}/${worker}`));
    editCounts = {};
    renderEditSites();
    loadEditDate();
    const msg = document.getElementById("editMsg");
    msg.textContent = "삭제 완료!";
    msg.style.color = "#e94560";
    setTimeout(() => { msg.textContent = ""; }, 3000);
  }
};

window.renameWorker = function(i, name) {
  if (!name.trim()) return;
  WORKERS[i] = name.trim();

};
window.removeWorker = function(i) {
  if (WORKERS.length <= 1) { alert("최소 1명 필요"); return; }
  if (confirm(`"${WORKERS[i]}" 삭제?`)) {
    WORKERS.splice(i, 1);
    set(ref(db, "config/workers"), WORKERS);
    renderSettingsWorkers();
  }
};
window.addWorker = function() {
  const name = prompt("기사 이름:");
  if (!name || !name.trim()) return;
  WORKERS.push(name.trim());
  set(ref(db, "config/workers"), WORKERS);
  renderSettingsWorkers();
};

window.renameSite = function(i, name) {
  if (!name.trim()) return;
  SITES[i].name = name.trim();
  set(ref(db, "config/sites"), SITES);
};
window.removeSite = function(i) {
  if (SITES.length <= 1) { alert("최소 1개 필요"); return; }
  if (confirm(`"${SITES[i].name}" 삭제?`)) {
    SITES.splice(i, 1);
    set(ref(db, "config/sites"), SITES);
    renderSettingsSites();
  }
};
window.addSite = function() {
  const name = prompt("현장 이름:");
  if (!name || !name.trim()) return;
  SITES.push({name: name.trim(), color: COLORS[SITES.length % COLORS.length]});
  set(ref(db, "config/sites"), SITES);
  renderSettingsSites();
};

// ===== 정비/경비 (records/config 와 완전히 분리된 maintenance 노드) =====
const MAINT_TYPES = [
  {label:"경비", color:"#FF9800"},
  {label:"정비", color:"#2196F3"},
  {label:"수리", color:"#e94560"},
];
let maintType = "경비";
let allMaint = {};

function maintColor(type){ const t = MAINT_TYPES.find(x => x.label === type); return t ? t.color : "#888"; }
function wonFmt(n){ return (n||0).toLocaleString("ko-KR") + "원"; }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function renderMaintTypeRow() {
  const row = document.getElementById("maintTypeRow");
  row.innerHTML = "";
  MAINT_TYPES.forEach(t => {
    const sel = maintType === t.label;
    const btn = document.createElement("div");
    btn.className = "worker-btn" + (sel ? " selected" : "");
    btn.textContent = t.label;
    btn.style.borderColor = sel ? t.color : "#333";
    btn.style.background = sel ? t.color + "22" : "#16213e";
    btn.style.color = sel ? t.color : "#eee";
    btn.onclick = () => { maintType = t.label; renderMaintTypeRow(); };
    row.appendChild(btn);
  });
}

window.saveMaint = async function() {
  const date = document.getElementById("maintDate").value;
  const memo = document.getElementById("maintMemo").value.trim();
  const amount = parseInt(document.getElementById("maintAmount").value, 10) || 0;
  const msg = document.getElementById("maintMsg");
  if (!date) { msg.textContent = "날짜를 선택하세요"; msg.style.color = "#e94560"; return; }
  if (!memo && !amount) { msg.textContent = "내용이나 금액을 입력하세요"; msg.style.color = "#e94560"; return; }
  const id = "m_" + Date.now() + "_" + Math.floor(Math.random()*1000);
  await set(ref(db, `maintenance/${id}`), {date, type: maintType, memo, amount, ts: Date.now()});
  await set(ref(db, "lastActivity"), Date.now());
  msg.textContent = "저장 완료!";
  msg.style.color = "#4CAF50";
  document.getElementById("maintMemo").value = "";
  document.getElementById("maintAmount").value = "";
  setTimeout(() => { msg.textContent = ""; }, 3000);
};

window.deleteMaint = async function(id) {
  if (confirm("이 기록을 삭제할까요?")) {
    await remove(ref(db, `maintenance/${id}`));
  }
};

function renderMaint() {
  const area = document.getElementById("maintList");
  const entries = Object.entries(allMaint).map(([id, v]) => ({id, ...v}));
  if (entries.length === 0) {
    area.innerHTML = '<div class="month-empty">아직 기록이 없습니다</div>';
    return;
  }
  // 날짜 내림차순(최신 먼저), 같은 날은 입력순 최신 먼저
  entries.sort((a,b) => a.date === b.date ? (b.ts||0)-(a.ts||0) : (a.date < b.date ? 1 : -1));
  const groups = {};
  for (const e of entries) { const mk = (e.date||"").slice(0,7); (groups[mk] = groups[mk] || []).push(e); }
  const days = ["일","월","화","수","목","금","토"];
  const months = Object.keys(groups).sort().reverse();
  let html = "";
  for (const mk of months) {
    const [my, mm] = mk.split("-");
    const list = groups[mk];
    const sum = list.reduce((a,e) => a + (e.amount||0), 0);
    html += `<div class="maint-month-head"><span class="maint-month-title">${+my}년 ${+mm}월</span><span class="maint-month-sum">${wonFmt(sum)}</span></div>`;
    for (const e of list) {
      const [y,m,d] = e.date.split("-");
      const dt = new Date(+y, +m-1, +d);
      const col = maintColor(e.type);
      html += `<div class="maint-card">`;
      html += `<div class="maint-card-top"><span class="maint-badge" style="background:${col}22;color:${col}">${e.type}</span>`;
      html += `<span class="maint-card-date">${+m}/${+d}(${days[dt.getDay()]}) <span style="color:#e94560;cursor:pointer;margin-left:6px" onclick="deleteMaint('${e.id}')">[x]</span></span></div>`;
      if (e.memo) html += `<div class="maint-card-memo">${escapeHtml(e.memo)}</div>`;
      if (e.amount) html += `<div class="maint-card-amount">${wonFmt(e.amount)}</div>`;
      html += `</div>`;
    }
  }
  area.innerHTML = html;
}

// ===== Firebase 리스너 =====
onValue(ref(db, "maintenance"), snap => {
  allMaint = snap.val() || {};
  if (document.getElementById("tabMaint").classList.contains("active")) renderMaint();
});
onValue(ref(db, "records"), snap => {
  allRecords = snap.val() || {};
  renderTodayRecords();
  if (document.getElementById("historyArea").style.display !== "none") renderHistory();
  if (document.getElementById("tabMonthly").classList.contains("active")) renderMonthly();
});

// ===== 초기화 =====
async function init() {
  const ok = await checkExpiry();
  if (!ok) return;
  set(ref(db, "lastActivity"), Date.now());
  loadConfig();
}
init();
</script>
